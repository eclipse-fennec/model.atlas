services:
  model-atlas:
    image: eclipsefennec/model.atlas:apicurio-snapshot
    ports:
      - "8080:8080"
    environment:
      - APICURIO_HOST=apicurio-registry
      - APICURIO_PORT=8080
      # Path inside the container that InitialModelLoader scans once on startup
      # for .ecore / .jsonschema / .qvto files. Override or remove to disable.
      - INITIAL_MODELS_FOLDER=/initial-models
    volumes:
      # Mount a host folder with the models you want deployed on first start.
      # Replace ./initial-models with the path on your host machine.
      - ./initial-models:/initial-models:ro

# --- Apicurio Registry ---
  apicurio-registry:
    container_name: apicurio-registry
    image: apicurio/apicurio-registry:latest-release
    ports:
      - "8081:8080"
    environment:
      - APICURIO_REST_DELETION_GROUP_ENABLED=true
      - APICURIO_REST_DELETION_ARTIFACT_ENABLED=true
      - APICURIO_REST_DELETION_ARTIFACT-VERSION_ENABLED=true
      - APICURIO_REST_MUTABILITY_ARTIFACT_VERSION_CONTENT_ENABLED=true

  apicurio-registry-ui:
    container_name: apicurio-registry-ui
    image: apicurio/apicurio-registry-ui:latest-release
    ports:
      - "8888:8080"
    environment:
      - REGISTRY_API_URL=http://localhost:8081/apis/registry/v3
