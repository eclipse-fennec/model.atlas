services:
  model-atlas:
    image: eclipsefennec/model.atlas:file-snapshot
    ports:
      - "8080:8080"
    environment:
      # Path inside the container that InitialModelLoader scans once on startup
      # for .ecore / .jsonschema / .qvto files. Override or remove to disable.
      - INITIAL_MODELS_FOLDER=/initial-models
      # The GDPR review runs from inside this runtime: it pays Anthropic, and Anthropic dials the
      # GDPR MCP server from its own side, so a localhost URL cannot work. Passed through from the
      # host environment - nothing is stored here. With them unset the check service simply never
      # activates, and a model entering 'approved' is not reviewed.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GDPR_MCP_PUBLIC_URL=${GDPR_MCP_PUBLIC_URL:-}
      - MCP_GDPR_AUTH_TOKEN=${MCP_GDPR_AUTH_TOKEN:-}
      # The tenant scope this image defines, and the scope the GDPR review runs in. Must match
      # MODEL_ATLAS_SCOPE on the GDPR MCP server, or reviews are triggered in one scope and the
      # model is looked for in another.
      - MODEL_ATLAS_SCOPE=${MODEL_ATLAS_SCOPE:-jena}
    volumes:
      # Mount a host folder with the models you want deployed on first start.
      # Replace ./initial-models with the path on your host machine.
      - ./initial-models:/initial-models:ro
