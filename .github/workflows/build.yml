name: CI Build

on:
  push:
    # Build-only on every branch EXCEPT main and snapshot (those release/publish via
    # their dedicated workflows). All other branches only verify.
    branches-ignore:
      - main
      - snapshot
  pull_request:
    branches:
      - '*'

# Least privilege by default; this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@227b1dfa5f323fdd6d857d0a61fbaaf6e7288716 # v1.0.0
    with:
      # Gradle 8.14 cannot run on JDK 25; this workspace targets Java 21.
      java-versions: '["21"]'
      # No perfTest task in this workspace.
      run-perf-tests: false

  # Repo-specific: verify the runtime bndruns still resolve and export.
  export:
    name: Runtime Export Check
    runs-on: ubuntu-latest
    env:
      LC_ALL: en_US.UTF-8
      GRADLE_OPTS: >-
        -Dorg.gradle.parallel=false
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          cache: gradle
          java-version: 21
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Resolve ModelAtlas bndrun
        run: ./gradlew org.eclipse.fennec.model.atlas.runtime:resolve.modelatlas.runtime_base --info
      - name: Export ModelAtlas Apicurio bndrun
        run: ./gradlew org.eclipse.fennec.model.atlas.runtime:export.modelatlas.runtime_docker_apicurio --info
      - name: Export ModelAtlas File bndrun
        run: ./gradlew org.eclipse.fennec.model.atlas.runtime:export.modelatlas.runtime_docker_file --info
      - name: Upload JAR Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jar-files
          path: |
            **/generated/distributions/executable/modelatlas.runtime_docker_apicurio.jar
            **/generated/distributions/executable/modelatlas.runtime_docker_file.jar
            org.eclipse.fennec.model.atlas.rest.application/generated/org.eclipse.fennec.model.atlas.rest.application.jar
      - name: Upload Problem Report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Problem-report
          path: |
            build/reports/problems/problems-report.html
