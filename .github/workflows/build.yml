name: CI Build

on:
  push:
    # Build-only on every branch EXCEPT main and snapshot (those release/publish via
    # their dedicated workflows). All other branches only verify.
    branches-ignore:
      - main
      - snapshot
  pull_request:
    branches:
      - '*'

# Least privilege by default; this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned to issue-13-release-extra-tasks; bump to the release tag once merged.
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@43722f4454a87e09d3aa76d8b2bf3fe7fc47715b
    with:
      # Gradle 8.14 cannot run on JDK 25; this workspace targets Java 21.
      java-versions: '["21"]'
      # No perfTest task in this workspace.
      run-perf-tests: false
      # bnd resolve/export tasks are not parallel-safe in this workspace.
      gradle-parallel: false
      # Validate that the runtime bndruns still resolve and export.
      extra-gradle-tasks: >-
        org.eclipse.fennec.model.atlas.runtime:resolve.modelatlas.runtime_base
        org.eclipse.fennec.model.atlas.runtime:export.modelatlas.runtime_docker_apicurio
        org.eclipse.fennec.model.atlas.runtime:export.modelatlas.runtime_docker_file
