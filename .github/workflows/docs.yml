name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - snapshot
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# No workflow-level concurrency here, deliberately: the reusable workflow's deploy
# job already serializes on the job-level group `pages`. Declaring the same group
# at the caller level made the deploy job deadlock against its own workflow run —
# it failed with zero steps on every run since the docs-site landed (#226).
jobs:
  docs:
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@227b1dfa5f323fdd6d857d0a61fbaaf6e7288716 # v1.0.0
