import aQute.bnd.gradle.Export

plugins {
  id "org.sonarqube" version "6.2.0.5505"
  id 'jacoco'
  id 'java'
  id 'org.geckoprojects.bnd.update'
}

// We need to define a repository for the root project, otherwise Jacoco dependencies cannot be resolved
repositories {
  mavenCentral()
  // Only for the SBOM exporter, which has no release yet (see sbomExporter below).
  maven {
    url = 'https://central.sonatype.com/repository/maven-snapshots/'
    mavenContent {
      snapshotsOnly()
      includeGroup 'org.geckoprojects.bnd'
    }
  }
}

// SBOM of the resolved application: `./gradlew sbom` writes a CycloneDX SBOM per bndrun to
// <project>/generated/sbom/ (options in the bndrun's -sbom instruction). The exporter is a bnd
// plugin (org.gecko.bnd.sbom); Gradle fetches it into cnf/cache/sbom-exporter/, and only then
// do the bndruns include it (cnf/sbom/plugin.bnd). The ordinary build never loads it.
configurations {
  sbomExporter {
    canBeConsumed = false
    transitive = false
  }
}
dependencies {
  // TODO switch to the first release once org.gecko.bnd.sbom is on Maven Central
  sbomExporter 'org.geckoprojects.bnd:org.gecko.bnd.sbom:0.1.0-SNAPSHOT'
}
def sbomExporter = tasks.register('sbomExporter', Sync) {
  description = 'Fetches the SBOM exporter into cnf/cache/sbom-exporter/, where the bndruns pick it up.'
  from configurations.sbomExporter
  into 'cnf/cache/sbom-exporter'
  rename { 'org.gecko.bnd.sbom.jar' }
}

def sbomBndruns = [
  // the runtime of the published docker image (docker/modelatlas_file)
  'org.eclipse.fennec.model.atlas.runtime': 'modelatlas.runtime_docker_file.bndrun'
]
// Register only for the projects that are part of this build.
def sbomTasks = sbomBndruns.findResults { projectName, bndrunName ->
  def p = findProject(":${projectName}")
  p?.tasks?.register('sbom', Export) {
    description = "Writes the SBOM of ${bndrunName} (CycloneDX) to generated/sbom/."
    group = 'export'
    dependsOn sbomExporter
    bndrun = p.file(bndrunName)
    exporter = 'bnd.sbom'
    destinationDirectory = p.layout.projectDirectory.dir('generated/sbom')
  }
}
tasks.register('sbom') {
  description = 'Writes the SBOMs of the Model Atlas runtimes (see sbomBndruns).'
  group = 'export'
  dependsOn sbomTasks
}

// bnd update (org.gecko.bnd.update): reports only, nothing is changed.
//   ./gradlew bndUpdates                    newer versions in the .mvn indexes, within the policy
//   ./gradlew bndVulnerabilities -PbndUpdateTrivy=<trivy.json> -PbndUpdateSbom=<sbom.cdx.json>
//                                           for each library of the Trivy report of that SBOM:
//                                           the smallest fixing version within the policy
// Reports in build/bnd-update/. The policy is micro updates unless -PbndUpdateScope says
// otherwise. Findings never fail the build here; the gate is the Trivy step in sbom.yml.
bndUpdate {
  scope = providers.gradleProperty('bndUpdateScope').orElse('micro')
  format = providers.gradleProperty('bndUpdateFormat').orElse('markdown')
  failOnFindings = false
  if (providers.gradleProperty('bndUpdateTrivy').isPresent()) {
    trivyReport = file(providers.gradleProperty('bndUpdateTrivy').get())
  }
  if (providers.gradleProperty('bndUpdateSbom').isPresent()) {
    sbom = file(providers.gradleProperty('bndUpdateSbom').get())
  }
}

subprojects {

    //  Apply plugin: 'jacoco' to all submodules JUnit tests are generated as generated/jacoco/test.exec
    apply plugin: 'jacoco'
    apply plugin: 'java'
    // We need to define a repository, otherwise Jacoco dependencies cannot be resolved
    repositories {
        mavenCentral()
    }
    // Allow gradle to enable JUnit support in submodules
    test {
        useJUnitPlatform()
        // Some bundles (e.g. mediatypes.impl) carry test sources that only run
        // as OSGi integration tests via testOSGi; Gradle 9 fails the plain
        // `test` task by default when it discovers no tests.
        failOnNoDiscoveredTests = false
    }
    
       // Add JUnit dependencies for modules that have Gradle tests
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
        testImplementation 'org.junit.platform:junit-platform-launcher:1.13.4'
        testImplementation 'org.mockito:mockito-junit-jupiter:4.11.0'
        testImplementation 'org.assertj:assertj-core:3.27.4'
    }

    // The git webhook REST unit tests exercise resource/filter code that builds
    // jakarta.ws.rs Response objects, which need a JAX-RS RuntimeDelegate on the
    // classpath. jersey-common (already the runtime's JAX-RS provider, v3.1.3)
    // supplies one via ServiceLoader. Test-scoped only — it is not a
    // compile/runtime dependency of the bundle itself.
    if (name in ['org.eclipse.fennec.model.atlas.management.git.webhook.rest',
                 'org.eclipse.fennec.model.atlas.rest.filter',
                 'org.eclipse.fennec.model.atlas.rest.documentation']) {
        dependencies {
            testImplementation 'org.glassfish.jersey.core:jersey-common:3.1.3'
        }
    }

}

// Sonar setup
sonarqube {
  properties {
    property "sonar.projectName", "fennec.bnd.libraries"
    property "sonar.projectKey", "eclipse-fennec-fennec.bnd.libraries"
    property "sonar.organization", "eclipse-fennec"
    property "sonar.host.url", "https://sonarcloud.io"
    property "sonar.coverage.jacoco.xmlReportPaths", "${rootDir}/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml"
    //property "sonar.exclusions", "org.eclipse.fennec.project/**/*.java, org.eclipse.fennec.other.project/**/*.java"
  }
}

task codeCoverageReport(type: JacocoReport) {
    dependsOn(test)
    // Gather execution data from all subprojects for JUnit generated/jacoco/test.exec for OSGi Tests generated/tmp/testOSGi/generated/jacoco.exec
    // Latter are generated via agent in the test.bndrun
    executionData fileTree(project.rootDir.absolutePath).include("**/**/*.exec")

    // Add all relevant sourcesets from the subprojects
    subprojects.each {
        sourceSets it.sourceSets.main
    }

    // Generate xml reports for tools like sonar and html for humans
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named("sonar") {
    dependsOn(codeCoverageReport)
}

