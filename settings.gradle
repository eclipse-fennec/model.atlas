pluginManagement {
  plugins {
    id 'biz.aQute.bnd.workspace' version bnd_version
  }
  repositories {
    maven {
      url = uri(bnd_snapshots)
      content {
        snapshotsOnly()
        includeGroup('biz.aQute.bnd')
        includeGroup('biz.aQute.bnd.workspace')
      }
    }
    mavenCentral()
    gradlePluginPortal()
    rootProject.name="org.eclipse.fennec.model.atlas"
  }
}
plugins {
  id 'biz.aQute.bnd.workspace'
}
include ":docker:modelatlas_apicurio"
include ":docker:modelatlas_file"