# GitLab CI/CD Pipeline for Fennec Model Atlas
# Mirrors the GitHub Actions workflows (license.yml and build.yml)

stages:
  - license
  - build
  - docker

variables:
  LC_ALL: en_US.UTF-8
  GRADLE_OPTS: "-Dorg.gradle.parallel=true"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

# Cache Gradle dependencies between jobs
.gradle-cache: &gradle-cache
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/wrapper
      - .gradle/caches

# License Check Job
license-check:
  stage: license
  image: apache/skywalking-eyes:latest
  script:
    - license-eye header check

    # Build Job
build:
  stage: build
  image: eclipse-temurin:21-jdk
  services:
    - docker:dind
  variables:
    # Docker-in-Docker configuration for Testcontainers
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Testcontainers configuration
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_RYUK_DISABLED: "true"
  <<: *gradle-cache
  before_script:
    - chmod +x ./gradlew
    - ./gradlew --no-daemon --version
  script:
    - ./gradlew build --info --stacktrace
    - ./gradlew org.eclipse.fennec.model.atlas.runtime:resolve.modelatlas.runtime_base --info
    - ./gradlew org.eclipse.fennec.model.atlas.runtime:export.modelatlas.runtime_docker --info
  artifacts:
    when: always
    paths:
      - "**/generated/distributions/executable/modelatlas.runtime_docker.jar"
    reports:
      junit:
        - "**/test-reports/*/TEST-*.xml"
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Docker Build Job (build only, no push)
docker-build:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  needs:
    - job: build
      artifacts: true
  before_script:
    - docker info
    # Prepare docker context
    - mkdir -p docker/modelatlas/content/
    - mv **/generated/distributions/executable/modelatlas.runtime_docker.jar docker/modelatlas/content/modelatlas.runtime_docker.jar || true
    - mkdir -p docker/modelatlas/content/runtime/
    - cp -rf org.eclipse.fennec.model.atlas.runtime/runtime/* docker/modelatlas/content/runtime/
    - ls -lR docker/modelatlas/content
  script:
    - docker build -t fennec/model.atlas:${CI_COMMIT_REF_SLUG} docker/modelatlas/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "snapshot"
